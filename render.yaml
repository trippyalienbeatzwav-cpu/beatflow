# Render Blueprint for the TUNIBEAT Node server (API, WebSockets, media, audio workers).
# Render dashboard → New → Blueprint → pick this repository. The front end stays on Vercel (see middleware.js).
# A persistent disk is required (SQLite database, uploads, prepared downloads); disks need a paid instance type.
services:
  - type: web
    name: beatflow-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: tunibeat-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: DOWNLOAD_SECRET
        generateValue: true
      # Same value as PROXY_SECRET in the Vercel project (24+ random characters)
      - key: PROXY_SECRET
        sync: false
      # The public site, used in email links, e.g. https://beatflow-blond.vercel.app
      - key: PUBLIC_URL
        sync: false
      # Email (verification codes, password resets) through Resend: https://resend.com
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Set to "false" to start with an empty store instead of the demo catalog
      - key: SEED_DEMO
        value: "true"
